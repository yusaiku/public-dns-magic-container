# Nginx speaks HTTP/1.1 to upstreams. Unbound DoH is HTTP/2 only.
# This process turns the local HTTP/1.1 request into h2c for Unbound.
global
    maxconn 256

defaults
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 10s
    timeout http-request 10s
    timeout http-keep-alive 4s

frontend doh
    bind 127.0.0.1:4444 proto h1
    default_backend unbound

backend unbound
    server local 127.0.0.1:4443 proto h2
