# Nginx speaks HTTP/1.1 to upstreams. Unbound DoH is HTTP/2 only.
# This process turns the local HTTP/1.1 request into h2c for Unbound.
# It also accepts public DoT and limits how many connections one address opens.
global
    maxconn 2000

defaults
    timeout connect 2s
    timeout client 10s
    timeout server 10s

frontend doh
    mode http
    bind 127.0.0.1:4444 proto h1
    option http-buffer-request
    timeout http-request 5s
    timeout http-keep-alive 4s
    default_backend unbound

backend unbound
    mode http
    server local 127.0.0.1:4443 proto h2

frontend dot
    mode tcp
    bind 0.0.0.0:853
    timeout client 60s
    filter bwlim-in dotin default-limit 64k default-period 1s
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 8 }
    tcp-request connection reject if { sc0_conn_rate gt 20 }
    tcp-request content set-bandwidth-limit dotin
    default_backend dotback

backend dotback
    mode tcp
    timeout server 60s
    server local 127.0.0.1:853
