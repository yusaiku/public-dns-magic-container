server:
    verbosity: 1
    interface: 127.0.0.1
    port: 53
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    root-hints: "/etc/unbound/root.hints"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Unbound owns the public TLS listeners. DoH is HTTP/2, which nginx cannot proxy.
    interface: 0.0.0.0@443
    https-port: 443
    interface: 0.0.0.0@853
    tls-port: 853
    tls-service-key: "/etc/nginx/ssl/privkey.pem"
    tls-service-pem: "/etc/nginx/ssl/fullchain.cer"

    do-not-query-localhost: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    prefetch: yes
    cache-min-ttl: 0
    cache-max-ttl: 86400

    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow

    log-queries: no
    log-replies: no

remote-control:
    control-enable: no
