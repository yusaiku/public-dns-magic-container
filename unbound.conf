server:
    verbosity: 1
    interface: 127.0.0.1
    port: 53
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    # DNSKEY sets such as .org do not fit in UDP. The authority sets TC
    # and the lookup continues over TCP. A short MSS keeps that segment
    # inside tunnel MTUs that otherwise drop it and turn the name into
    # SERVFAIL.
    edns-buffer-size: 1232
    max-udp-size: 1232
    outgoing-tcp-mss: 1220
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    root-hints: "/etc/unbound/root.hints"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # No forward-zone. Recursion starts at the root servers in root.hints.
    qname-minimisation: yes

    # DoH stays on loopback. Nginx terminates public TLS on 443 and reaches
    # this port through a local HTTP/2 bridge. Every DoH client arrives as
    # 127.0.0.1, so per-client limits for DoH live in Nginx.
    interface: 127.0.0.1@4443
    https-port: 4443
    http-notls-downstream: yes
    http-endpoint: /dns-query

    # DoT is reached through HAProxy on 0.0.0.0:853. Unbound expects a
    # PROXYv2 header inside the TLS payload on this port, which a TCP proxy
    # cannot insert, so the client address stays at HAProxy.
    interface: 127.0.0.1@853
    tls-port: 853
    quic-port: 0
    tls-service-key: "/etc/nginx/ssl/privkey.pem"
    tls-service-pem: "/etc/nginx/ssl/fullchain.cer"

    do-not-query-localhost: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    prefetch: yes
    deny-any: yes
    minimal-responses: yes
    hide-identity: yes
    hide-version: yes

    # Strip private addresses from answers so a public client is not pointed
    # at an internal network.
    private-address: 0.0.0.0/8
    private-address: 10.0.0.0/8
    private-address: 127.0.0.0/8
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    cache-min-ttl: 0
    cache-max-ttl: 86400
    cache-max-negative-ttl: 60
    msg-cache-size: 16m
    rrset-cache-size: 32m

    # Caps for a small public resolver. Loopback is exempt from wait-limit,
    # so the DoH bridge is not counted against one shared client.
    incoming-num-tcp: 128
    outgoing-num-tcp: 20
    num-queries-per-thread: 512
    jostle-timeout: 200
    tcp-idle-timeout: 10000
    wait-limit: 40
    unwanted-reply-threshold: 10000000

    # Nginx and HAProxy already limit each client address. Unbound only sees
    # 127.0.0.1 for those queries, so a per-address cap here would throttle
    # every user at once. ratelimit slows one name that is asked too often.
    ip-ratelimit: 0
    ratelimit: 100

    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow

    log-queries: no
    log-replies: no
    log-servfail: no

remote-control:
    control-enable: no
